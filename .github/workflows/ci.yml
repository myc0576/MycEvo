name: MycEvo CI

on: push

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m pip install -e .
      - run: python -c "import mycevo; print(mycevo.__version__)"
      - run: mycevo --help
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
