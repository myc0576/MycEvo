    - {ref: https://raw.githubusercontent.com/myc0576/smartmoney-cub-harness/acf7d6d3fd99dd6de61593a5101f56b1ff4e02f4/src/smartmoney_cub_harness/decision.py, sha256: e70c6cac19dd90a80e05e98342d795f22dac638c518f10860a4e67c42837e4fb}
