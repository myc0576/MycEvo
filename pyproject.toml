[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mycevo"
version = "0.2.0rc1"
description = "Local workflow governance and memory across Codex, Claude Code, Cursor, and other Agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MycEvo maintainers" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyYAML>=6.0",
  "fastmcp>=2.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.urls]
Documentation = "https://github.com/myc0576/MycEvo#readme"
Issues = "https://github.com/myc0576/MycEvo/issues"
Source = "https://github.com/myc0576/MycEvo"

[project.scripts]
mycevo = "mycevo.cli:main"
resevo = "mycevo.compat:resevo_main"
researchloop = "mycevo.compat:researchloop_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mycevo = ["resources/workspace/**/*", "schemas/*.json"]
